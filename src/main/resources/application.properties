spring.application.name=chatop

# Charge .env (format NOM=valeur) ; les variables d'environnement réelles restent prioritaires
spring.config.import=optional:file:.env[.properties]

# Même port que Mockoon, pour que le proxy du front fonctionne sans modification
server.port=3001

jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=86400

spring.datasource.url=jdbc:mysql://localhost:3306/chatop_db
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.upload-dir=uploads
app.base-url=http://localhost:3001
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB